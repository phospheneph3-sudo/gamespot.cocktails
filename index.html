.shade{position:fixed; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(180deg, rgba(7,7,7,.55) 0%, rgba(7,7,7,.30) 32%, rgba(7,7,7,.62) 100%)}
.wrap{position:relative; z-index:2; width:100%; max-width:420px; display:flex;
  flex-direction:column; align-items:center; flex:1}

.logo{width:188px; height:auto; display:block; margin-bottom:12px}
h1{font-family:var(--head); font-weight:800; font-size:clamp(34px,10vw,48px); line-height:1.0;
  text-align:center; letter-spacing:-.04em; margin-bottom:10px;
  text-shadow:0 6px 36px rgba(0,0,0,.6)}
h1 em{font-style:normal; color:var(--lime)}
.sub{font-size:15.5px; color:var(--mut); text-align:center; margin-bottom:20px; line-height:1.45}

/* карточка игрока */
.scene{width:100%; perspective:1300px; margin-bottom:18px}
.card{position:relative; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.2,.75,.25,1)}
.card.flipped{transform:rotateY(180deg)}
.face{backface-visibility:hidden; border-radius:24px; overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.5)}
.back{background:#121212; border:2px solid rgba(114,192,66,.45);
  min-height:420px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px}
.back .mark{width:104px; height:auto; opacity:.95}
.back b{font-family:var(--head); font-weight:800; font-size:14px; letter-spacing:.16em; color:var(--lime)}
.back i{font-style:normal; font-size:13.5px; color:var(--mut)}

.front{position:absolute; inset:0; transform:rotateY(180deg); background:#121212;
  border:2px solid var(--lime); display:flex; flex-direction:column}
.fhead{background:linear-gradient(135deg,var(--lime),var(--lime2)); color:var(--ink);
  padding:16px 18px 14px}
.fhead .row{display:flex; justify-content:space-between; font-family:var(--head);
  font-weight:800; font-size:11px; letter-spacing:.14em; opacity:.7}
.fhead h2{font-family:var(--head); font-weight:800; font-size:clamp(22px,6.4vw,27px);
  line-height:1.08; letter-spacing:-.02em; margin-top:8px}
.fhead .role{font-size:14px; margin-top:4px; font-weight:700; opacity:.78}
.fbody{padding:16px 18px 18px; display:flex; flex-direction:column; gap:14px}
.quote{font-size:15.5px; line-height:1.45; color:#D9E3D1}
.stats{display:flex; flex-direction:column; gap:9px}
.st .l{display:flex; justify-content:space-between; font-size:12.5px; color:var(--mut); margin-bottom:5px}
.st .t{height:8px; border-radius:5px; background:#1E1E1E; overflow:hidden}
.st .f{height:100%; border-radius:5px; background:linear-gradient(90deg,var(--lime2),var(--yel));
  width:0; transition:width .8s cubic-bezier(.3,.7,.3,1)}
.skill{background:rgba(114,192,66,.10); border:1.5px solid rgba(114,192,66,.40);
  border-radius:14px; padding:13px 14px; display:flex; gap:13px; align-items:flex-start}
.sk-ico{width:44px; height:44px; flex:none; border-radius:12px; background:rgba(114,192,66,.16);
  display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px rgba(114,192,66,.28)}
.sk-ico svg{width:26px; height:26px; stroke:var(--lime2); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.skill small{display:block; font-family:var(--head); font-weight:800; font-size:10.5px;
  letter-spacing:.14em; color:var(--lime2); margin-bottom:5px}
.skill p{font-size:14.5px; line-height:1.4; color:#D9E3D1}
.drink{background:var(--ink); border-radius:14px; padding:12px 14px; display:flex;
  align-items:center; justify-content:space-between; gap:12px}
.drink small{display:block; font-family:var(--head); font-weight:800; font-size:10.5px;
  letter-spacing:.14em; color:var(--lime)}
.drink b{display:block; font-family:var(--head); font-weight:800; font-size:16px; margin-top:3px}
.drink u{text-decoration:none; font-family:var(--head); font-weight:800; font-size:17px;
  color:var(--yel); white-space:nowrap}

.btn{display:flex; align-items:center; justify-content:center; gap:12px; appearance:none; border:0; cursor:pointer; font-family:var(--head); font-weight:800;
  font-size:17px; padding:17px 26px; border-radius:16px; background:var(--lime); color:var(--ink);
  width:100%; box-shadow:0 10px 30px rgba(114,192,66,.22); transition:transform .15s}
.btn:active{transform:scale(.97)}
.bico{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; flex:none}
.btn.share{background:#fff; color:var(--ink); margin-top:12px;
  box-shadow:0 10px 30px rgba(255,255,255,.14)}
.btn.share:disabled{opacity:.6}
.ig{display:inline-flex; align-items:center; gap:10px; margin-top:26px; padding:12px 20px;
  border-radius:14px; border:1.5px solid rgba(114,192,66,.4); color:var(--lime2);
  text-decoration:none; font-weight:700; font-size:15px; background:rgba(114,192,66,.07)}
.ig svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2}
.btn.ghost{background:transparent; color:var(--lime); border:2px solid rgba(114,192,66,.5);
  box-shadow:none; margin-top:10px; font-size:15px; padding:14px 22px}
@media (prefers-reduced-motion: reduce){ .card,.f{transition:none} }
</style>

  const i=Math.floor(Math.random()*CARDS.length), c=CARDS[i];
  $('name').textContent=c.n; $('role').textContent=c.g+' · '+c.r; $('quote').textContent=c.q;
  $('skill').textContent=c.k; $('skico').innerHTML=ICONS[c.n]||ICONS['AWPer']; $('drink').textContent=c.d; $('price').textContent=c.p;
  $('num').textContent=String(i+1).padStart(2,'0')+'/'+CARDS.length;
  $('rare').textContent=c.rare;
  fills.forEach(f=>f.style.width='0');
  current={...c, num:String(i+1).padStart(2,'0')+'/'+CARDS.length};
  card.classList.add('flipped');
  go.style.display='none'; again.style.display='block'; share.style.display='block';
  setTimeout(()=>{ c.s.forEach((v,k)=>{ fills[k].style.width=v+'%'; vals[k].textContent=v; }); }, 420);
  setTimeout(()=>{busy=false;},760);
}
function reset(){
  if(busy) return; busy=true;
  card.classList.remove('flipped');
  again.style.display='none'; share.style.display='none'; go.style.display='block';
  setTimeout(()=>{busy=false;},760);
}

/* ═══ КАРТИНКА ДЛЯ СТОРИС 1080 × 1920 ═══ */
const cv=$('cv'), share=$('share');
let current=null;

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrapText(c,text,x,y,maxW,lh){
  const words=String(text).split(' '); let line='', yy=y;
  for(const w of words){
    const t=line?line+' '+w:w;
    if(c.measureText(t).width>maxW && line){ c.fillText(line,x,yy); line=w; yy+=lh; }
    else line=t;
  }
  if(line) c.fillText(line,x,yy);
  return yy+lh;
}

let bgImg=null;
(function loadBg(){
  const url=getComputedStyle(document.querySelector('.bg')).backgroundImage.match(/url\(["']?(.+?)["']?\)/);
  if(!url) return;
  const i=new Image(); i.onload=()=>{bgImg=i;}; i.src=url[1];
})();

function paint(c0){
  const c=cv.getContext('2d'), W=1080, H=1920;
  c.fillStyle='#070707'; c.fillRect(0,0,W,H);
  if(bgImg){
    const s=Math.max(W/bgImg.width, H/bgImg.height);
    const dw=bgImg.width*s, dh=bgImg.height*s;
    c.drawImage(bgImg,(W-dw)/2,(H-dh)/2,dw,dh);
  }
  const sg=c.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'rgba(7,7,7,.55)'); sg.addColorStop(.32,'rgba(7,7,7,.28)');
  sg.addColorStop(1,'rgba(7,7,7,.66)');
  c.fillStyle=sg; c.fillRect(0,0,W,H);

  const logo=document.querySelector('img.logo');
  if(logo && logo.complete){ const lw=300, lh=lw*logo.naturalHeight/logo.naturalWidth;
    c.drawImage(logo,(W-lw)/2,92,lw,lh); }

  /* ── карточка ── */
  const CX=64, CY=268, CWD=W-CX*2, CHT=1300, R=46;
  c.save(); c.shadowColor='rgba(114,192,66,.26)'; c.shadowBlur=60;
  c.fillStyle='#121212'; rr(c,CX,CY,CWD,CHT,R); c.fill(); c.restore();
  c.strokeStyle='#72C042'; c.lineWidth=4; rr(c,CX,CY,CWD,CHT,R); c.stroke();

  /* шапка карточки */
  c.save(); rr(c,CX,CY,CWD,300,R); c.clip();
  const hg=c.createLinearGradient(CX,CY,CX+CWD,CY+300);
  hg.addColorStop(0,'#72C042'); hg.addColorStop(1,'#A6DC4A');
  c.fillStyle=hg; c.fillRect(CX,CY,CWD,300);
  c.restore();
  c.fillStyle='rgba(6,10,5,.62)'; c.font='800 28px Unbounded, sans-serif';
  c.textAlign='left';  c.fillText(c0.num, CX+44, CY+62);
  c.textAlign='right'; c.fillText(c0.rare, CX+CWD-44, CY+62);
  c.textAlign='left';
  c.fillStyle='#060A05';
  let fs=96; c.font='800 '+fs+'px Unbounded, sans-serif';
  while(c.measureText(c0.n).width > CWD-88 && fs>48){ fs-=4; c.font='800 '+fs+'px Unbounded, sans-serif'; }
  c.fillText(c0.n, CX+44, CY+186);
  c.fillStyle='rgba(6,10,5,.72)'; c.font='700 36px Onest, sans-serif';
  c.fillText(c0.g+' · '+c0.r, CX+44, CY+248);

  /* тело карточки */
  const PX=CX+44, PW=CWD-88;
  let y=CY+300+74;
  c.fillStyle='#D9E3D1'; c.font='400 38px Onest, sans-serif';
  y=wrapText(c,c0.q,PX,y,PW,52)+22;

  const names=['Реакция','Нервы','Командность','Удача'];
  c0.s.forEach((v,i)=>{
    c.fillStyle='#8A9682'; c.font='500 30px Onest, sans-serif'; c.fillText(names[i],PX,y);
    c.textAlign='right'; c.fillStyle='#fff'; c.font='800 30px Unbounded, sans-serif';
    c.fillText(String(v),PX+PW,y); c.textAlign='left'; y+=20;
    c.fillStyle='#1E1E1E'; rr(c,PX,y,PW,14,7); c.fill();
    const gg=c.createLinearGradient(PX,0,PX+PW*v/100,0);
    gg.addColorStop(0,'#72C042'); gg.addColorStop(1,'#D8F04A');
    c.fillStyle=gg; rr(c,PX,y,PW*v/100,14,7); c.fill();
    y+=56;
  });
  y+=14;
  c.fillStyle='rgba(114,192,66,.12)'; rr(c,PX,y,PW,170,24); c.fill();
  c.strokeStyle='rgba(114,192,66,.45)'; c.lineWidth=3; rr(c,PX,y,PW,170,24); c.stroke();
  c.fillStyle='#9BDE6E'; c.font='800 24px Unbounded, sans-serif';
  c.fillText('ОСОБЫЙ НАВЫК',PX+30,y+50);
  c.fillStyle='#D9E3D1'; c.font='400 34px Onest, sans-serif';
  wrapText(c,c0.k,PX+30,y+100,PW-60,44);
  y+=170+26;

  c.fillStyle='#0A0A0A'; rr(c,PX,y,PW,140,24); c.fill();
  c.strokeStyle='rgba(255,255,255,.10)'; c.lineWidth=2; rr(c,PX,y,PW,140,24); c.stroke();
  c.fillStyle='#72C042'; c.font='800 22px Unbounded, sans-serif';
  c.fillText('ТВОЙ КОКТЕЙЛЬ',PX+30,y+48);
  c.fillStyle='#fff'; c.font='800 38px Unbounded, sans-serif';
  c.fillText(c0.d,PX+30,y+102);
  c.textAlign='right'; c.fillStyle='#D8F04A'; c.font='800 40px Unbounded, sans-serif';
  c.fillText(c0.p,PX+PW-30,y+102); c.textAlign='center';

  /* ── призыв под карточкой ── */
  const by=CY+CHT+58, bh=118, bw=CWD;
  c.fillStyle='#72C042'; rr(c,CX,by,bw,bh,36); c.fill();
  c.fillStyle='#060A05'; c.font='800 46px Unbounded, sans-serif';
  c.fillText('А ТЫ КТО СЕГОДНЯ?', W/2, by+74);
  c.fillStyle='#7F8C78'; c.font='500 30px Onest, sans-serif';
  c.fillText('Наведи камеру на карточку в GameSpot', W/2, by+bh+56);
  c.fillStyle='#9BDE6E'; c.font='800 32px Unbounded, sans-serif';
  c.fillText('@gamespot.club', W/2, by+bh+108);
}

async function doShare(){
  if(!current) return;
  share.disabled=true;
  const old=share.textContent; share.textContent='Готовим картинку…';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    paint(current);
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const file=new File([blob],'gamespot-role.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
      share.textContent=old;
    }else{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='gamespot-role.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      share.textContent='Картинка сохранена';
      setTimeout(()=>{share.textContent=old;},2200);
    }
  }catch(e){ share.textContent=old; }
  share.disabled=false;
}
share.addEventListener('click',doShare);

go.addEventListener('click',draw);
again.addEventListener('click',reset);
card.addEventListener('click',()=>{ card.classList.contains('flipped')?reset():draw(); });
</script>
</body>
</html>
